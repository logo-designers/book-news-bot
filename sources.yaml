# ─────────────────────────────────────────────────────────────
#  Джерела новин для бота
#  Після змін перезапустіть бота. Перевірити джерела:  python -m bookbot check
# ─────────────────────────────────────────────────────────────
#
#  Поля джерела:
#    name     — назва (показується в пості)
#    url      — адреса RSS/Atom-стрічки. Можна дати й адресу сайту — бот спробує знайти RSS сам
#    enabled  — true/false
#    include  — публікувати лише новини, де є хоч одне з цих слів (порожньо = все)
#    exclude  — ніколи не публікувати новини з цими словами
#    tags     — хештеги, які додаються до кожного поста з цього джерела
#
#  Слова шукаються як частина слова без урахування регістру,
#  тому «новинк» знайде «новинка», «новинки», «новинку».

# Глобальний стоп-список (діє для всіх джерел)
exclude:
  - промокод
  - розпродаж
  - "знижка до"
  - "чорна п'ятниця"

# Автоматичні хештеги: якщо в заголовку чи анонсі є слово — додається тег
tag_rules:
  "#новинки": [новинк, вийшла друком, вийшов друком, побачила світ, вийде друком, вийшла книжка, нова книжка, нова книга, презентац, передпродаж, предзамовлен]
  "#переклади": [переклад]
  "#дитячі_книжки": [дитяч, для дітей, для підлітків, young adult]
  "#премії": [премі, лауреат, шортлист, шорт-лист, лонглист, лонг-лист, нагород]
  "#події": [фестивал, арсенал, форум видавців, ярмар, зустріч з автор, автограф-сесі, book fair]
  "#екранізації": [екраніз, серіал за, фільм за]
  "#рейтинги": [топ-, рейтинг, бестселер, найпопулярніш]

sources:
  # ── Українські книжкові медіа (WordPress-стрічки) ──
  - name: Читомо
    url: https://chytomo.com/feed/
    tags: ["#Читомо"]

  - name: ЛітАкцент
    url: https://litakcent.com/feed/
    tags: ["#ЛітАкцент"]

  - name: Друг читача
    url: https://vsiknygy.net.ua/feed/
    tags: ["#ДругЧитача"]

  # ── Агрегатор: Google Новини за пошуковим запитом ──
  # Дає ширше охоплення (видавництва, загальні медіа). Запит можна змінити в q=...
  - name: Google Новини
    url: https://news.google.com/rss/search?q=книжкова+новинка+OR+"нова+книжка"+OR+"вийшла+книжка"+OR+видавництво+when:3d&hl=uk&gl=UA&ceid=UA:uk
    include: [книж, книг, роман, видав, письменн, поет, збірк, переклад]
    exclude: [бухгалтер, трудова книжка, книга скарг, трудову книжку, червона книга]

