services:
  bookbot:
    build: .
    container_name: bookbot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bookbot.sqlite3
      SOURCES_FILE: /app/sources.yaml
    volumes:
      - bookbot-data:/app/data
      # джерела можна редагувати без перебудови образу — достатньо перезапуску
      - ./sources.yaml:/app/sources.yaml:ro

volumes:
  bookbot-data:
